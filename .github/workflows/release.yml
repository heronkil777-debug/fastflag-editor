name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name_installer: Flag Editor Setup 0.1.8.exe
            artifact_name_portable: Flag Editor Portable 0.1.8.exe
          - os: ubuntu-latest
            artifact_name_appimage: Flag Editor-0.1.8.AppImage
            artifact_name_deb: fastflag-editor_0.1.8_amd64.deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck && npm run typecheck:main

      - name: Build application
        run: npm run build

      - name: Package with electron-builder
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish=never

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Flag Editor Setup v0.1.8.exe
          path: release/Flag Editor Setup 0.1.8.exe
          retention-days: 1

      - name: Upload Windows portable
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Flag Editor Portable v0.1.8.exe
          path: release/Flag Editor Portable 0.1.8.exe
          retention-days: 1

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Flag Editor-v0.1.8.AppImage
          path: release/Flag Editor-0.1.8.AppImage
          retention-days: 1

      - name: Upload Linux deb
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fastflag-editor_v0.1.8_amd64.deb
          path: release/fastflag-editor_0.1.8_amd64.deb
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: Flag Editor Setup v0.1.8.exe
          path: artifacts/windows

      - name: Download Windows portable
        uses: actions/download-artifact@v4
        with:
          name: Flag Editor Portable v0.1.8.exe
          path: artifacts/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Flag Editor-v0.1.8.AppImage
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/windows/Flag Editor Setup v0.1.8.exe
            artifacts/windows/Flag Editor Portable v0.1.8.exe
            artifacts/linux/Flag Editor-v0.1.8.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS build (separado - pode falhar sem bloquear outros)
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: false  # Desabilitado temporariamente até corrigir
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck && npm run typecheck:main

      - name: Build application
        run: npm run build

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish=always